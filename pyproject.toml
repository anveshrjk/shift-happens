[project]
name = "shift-happens"
version = "0.1.0"
description = "AI-Powered Decision & Simulation Engine for Employee Shift Scheduling"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "ortools>=9.8",
    "pandas>=2.0",
    "streamlit>=1.30",
    "plotly>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
